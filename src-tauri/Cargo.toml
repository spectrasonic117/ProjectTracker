[package]
name = "project-tracker"
version = "0.1.0"
description = "ProjectTracker — tablero de proyectos estilo Trello como app nativa"
edition = "2021"

[lib]
name = "project_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "json", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
